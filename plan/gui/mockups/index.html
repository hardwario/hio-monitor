<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor GUI Mockups</title>
<!-- Static design mockups for plan/features/0004-m3-gui-shell.md, 0005-m3-console.md, 0006-m3-flash-settings.md
     and the M4 wizards 0007-0010 (screens prefixed "M4"). Not product code.
     Colour tokens = plan/gui/design-system.md. Fonts fall back to system fonts here. -->
<style>
:root, :root[data-theme="light"] {
  --bg:#FFFFFF; --surface:#F5F6F8; --surfaceRaised:#FFFFFF; --consoleBg:#FBFBFC; --border:#D5D9DF;
  --text:#1B1F24; --textMuted:#57606A; --accent:#0B5FCC; --onAccent:#FFFFFF; --success:#1A7F37;
  --warning:#8A5A00; --error:#C4232E; --logDebug:#636C76; --selection:#CCE0FF; --findMatch:#FFE08A;
  --findCurrent:#FFB224; --errorPanelBg:#FFF1F1; --warningPanelBg:#FFF6E0; --accentSoft:#E3EEFC;
  --page:#E9EBEF; --shadow:0 8px 28px rgba(0,0,0,.18);
}
:root[data-theme="dark"] {
  --bg:#1E1F26; --surface:#262833; --surfaceRaised:#2E3040; --consoleBg:#191A20; --border:#3A3D4D;
  --text:#E6E8EE; --textMuted:#9BA3B4; --accent:#79B8FF; --onAccent:#0B1A2E; --success:#56D364;
  --warning:#FFAB70; --error:#FF7B86; --logDebug:#8B93A6; --selection:#264F78; --findMatch:#6B5418;
  --findCurrent:#B07A10; --errorPanelBg:#3A2228; --warningPanelBg:#3A3020; --accentSoft:#24344A;
  --page:#121318; --shadow:0 8px 28px rgba(0,0,0,.5);
}
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--text);
  font:13px/1.4 Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
.mono { font-family:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size:12.5px; }
button { font:inherit; color:inherit; cursor:pointer; }
/* review chrome */
.review { position:sticky; top:0; z-index:50; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center;
  padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border); }
.review b { font-weight:600; margin-right:4px; }
.seg { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.seg button { border:0; background:transparent; padding:4px 10px; }
.seg button[aria-pressed="true"] { background:var(--accent); color:var(--onAccent); }
.screens { display:flex; flex-wrap:wrap; gap:4px; }
.screens button { border:1px solid var(--border); background:var(--bg); border-radius:14px; padding:3px 10px; }
.screens button[aria-pressed="true"] { border-color:var(--accent); background:var(--accentSoft); }
.note { max-width:1280px; margin:12px auto 0; padding:0 16px; color:var(--textMuted); }
.stage { padding:16px; overflow-x:auto; }
/* window */
.win { position:relative; margin:0 auto; width:1280px; height:800px; background:var(--bg); border:1px solid var(--border);
  border-radius:10px; overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow); }
.win.narrow { width:960px; height:600px; }
.titlebar { height:28px; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--textMuted);
  background:var(--surface); border-bottom:1px solid var(--border); flex:none; }
.tabbar { display:flex; align-items:flex-end; gap:2px; height:36px; padding:0 8px; background:var(--surface);
  border-bottom:1px solid var(--border); flex:none; }
.tab { display:flex; align-items:center; gap:8px; height:30px; padding:0 10px; border:1px solid transparent;
  border-bottom:0; border-radius:6px 6px 0 0; color:var(--textMuted); white-space:nowrap; max-width:260px; }
.tab.active { background:var(--bg); border-color:var(--border); color:var(--text); font-weight:600; margin-bottom:-1px; height:31px; }
.tab .x { opacity:.6; padding:0 2px; }
.tab-add { height:28px; width:28px; border:0; background:transparent; border-radius:6px; font-size:18px; color:var(--textMuted); margin-bottom:2px; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--textMuted); flex:none; }
.dot.ok { background:var(--success); } .dot.busy { background:var(--warning); } .dot.err { background:var(--error); }
.body { flex:1; display:flex; min-height:0; }
.rail { width:72px; flex:none; background:var(--surface); border-right:1px solid var(--border); display:flex;
  flex-direction:column; align-items:center; padding:8px 0; gap:4px; }
.narrow .rail { width:52px; }
.rail .item { width:60px; padding:6px 0; display:flex; flex-direction:column; align-items:center; gap:3px; border-radius:8px;
  color:var(--textMuted); font-size:11px; position:relative; border:0; background:transparent; }
.narrow .rail .item { width:44px; } .narrow .rail .item span.l { display:none; }
.rail .item .ic { width:40px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:13px; }
.rail .item.sel { color:var(--text); font-weight:600; }
.rail .item.sel .ic { background:var(--accentSoft); color:var(--accent); }
.rail .spacer { flex:1; }
.badge { position:absolute; top:3px; right:10px; width:9px; height:9px; border-radius:50%; background:var(--warning); border:2px solid var(--surface); }
.main { flex:1; display:flex; flex-direction:column; min-width:0; }
.devbar { height:48px; flex:none; display:flex; align-items:center; gap:12px; padding:0 12px; border-bottom:1px solid var(--border); background:var(--surface); }
.chip { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); white-space:nowrap; }
.chip .k { color:var(--textMuted); }
.state { display:flex; align-items:center; gap:6px; color:var(--textMuted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.grow { flex:1; }
.btn { height:30px; padding:0 14px; border-radius:6px; border:1px solid var(--border); background:var(--bg); font-weight:600; white-space:nowrap; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--onAccent); }
.btn.danger { background:var(--error); border-color:var(--error); color:#fff; }
.btn.ghost { border-color:transparent; background:transparent; }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.toolbar { height:40px; flex:none; display:flex; align-items:center; gap:2px; padding:0 8px; border-bottom:1px solid var(--border); }
.tb { height:30px; display:inline-flex; align-items:center; gap:6px; padding:0 8px; border:0; background:transparent; border-radius:6px; white-space:nowrap; }
.tb:hover { background:var(--surface); }
.tb.on { background:var(--accentSoft); color:var(--accent); font-weight:600; }
.narrow .tb .lbl { display:none; }
.sep { width:1px; height:20px; background:var(--border); margin:0 6px; }
.kbd { font-size:11px; color:var(--textMuted); }
.content { flex:1; min-height:0; display:flex; flex-direction:column; position:relative; }
/* console */
.split { flex:1; display:flex; min-height:0; }
.narrow .split { flex-direction:column; }
.pane { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
.pane + .pane { border-left:1px solid var(--border); }
.narrow .pane + .pane { border-left:0; border-top:1px solid var(--border); }
.panehead { height:32px; display:flex; align-items:center; gap:8px; padding:0 10px; border-bottom:1px solid var(--border); color:var(--textMuted); font-size:12px; flex:none; }
.panehead b { color:var(--text); }
.lines { flex:1; overflow:hidden; background:var(--consoleBg); padding:4px 0; position:relative; }
.ln { display:flex; gap:10px; padding:0 10px; white-space:pre; line-height:19px; }
.ln .t { color:var(--textMuted); flex:none; }
.ln .lv { width:12px; flex:none; font-weight:700; }
.ln.D, .ln.D .lv { color:var(--logDebug); } .ln.W .lv, .ln.W { color:var(--warning); } .ln.E .lv, .ln.E { color:var(--error); }
.ln.I .lv { color:var(--success); }
.ln.echo { color:var(--accent); }
.ln.sel { background:var(--selection); }
mark { background:var(--findMatch); color:var(--text); border-radius:2px; padding:0 1px; }
mark.cur { background:var(--findCurrent); outline:1px solid var(--text); }
.pill { position:absolute; right:14px; bottom:10px; background:var(--accent); color:var(--onAccent); border-radius:14px; padding:4px 12px; font-weight:600; box-shadow:var(--shadow); }
.input { display:flex; gap:8px; padding:8px 10px; border-top:1px solid var(--border); background:var(--bg); flex:none; }
.field { flex:1; height:30px; display:flex; align-items:center; gap:6px; padding:0 8px; border:1px solid var(--border); border-radius:4px; background:var(--bg); min-width:0; }
.field.focus { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.field.bad { border-color:var(--error); box-shadow:0 0 0 1px var(--error); }
.field .ph { color:var(--textMuted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tog { font-size:11px; padding:1px 5px; border-radius:4px; border:1px solid var(--border); color:var(--textMuted); }
.tog.on { border-color:var(--accent); color:var(--accent); background:var(--accentSoft); }
.findbar, .filterrow { display:flex; align-items:center; gap:6px; padding:6px 10px; border-bottom:1px solid var(--border); background:var(--surface); flex:none; flex-wrap:wrap; }
.levels { display:inline-flex; gap:4px; }
.lvchip { padding:2px 8px; border-radius:12px; border:1px solid var(--border); font-size:12px; }
.lvchip.on { background:var(--accentSoft); border-color:var(--accent); color:var(--accent); font-weight:600; }
.muted { color:var(--textMuted); }
.small { font-size:12px; }
.banner { display:flex; align-items:center; gap:10px; padding:7px 12px; background:var(--warningPanelBg); border-bottom:1px solid var(--border); flex:none; }
.banner .ico { color:var(--warning); font-weight:700; }
/* error panel */
.errp { margin:12px; border:1px solid var(--border); border-left:4px solid var(--error); background:var(--errorPanelBg); border-radius:6px; padding:12px 14px; display:flex; gap:12px; }
.errp .ico { color:var(--error); font-size:18px; line-height:1; }
.errp h3 { margin:0 0 6px; font-size:14px; }
.errp p { margin:2px 0; }
.errp .acts { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.details { margin-top:8px; padding:8px; border-radius:4px; background:var(--consoleBg); border:1px solid var(--border); }
/* cards / pages */
.scroll { flex:1; overflow:auto; padding:20px 24px; }
.cards { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
.card { border:1px solid var(--border); border-radius:8px; background:var(--bg); padding:16px; }
.card h2 { margin:0 0 12px; font-size:14px; display:flex; align-items:center; gap:8px; }
.card h2 .n { width:22px; height:22px; border-radius:50%; background:var(--accentSoft); color:var(--accent); display:inline-flex; align-items:center; justify-content:center; font-size:12px; }
.drop { border:1.5px dashed var(--border); border-radius:8px; padding:18px; display:flex; align-items:center; gap:14px; }
.row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.list { border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.li { display:flex; align-items:center; gap:12px; padding:9px 12px; border-top:1px solid var(--border); }
.li:first-child { border-top:0; }
.li.sel { background:var(--accentSoft); }
.radio { width:16px; height:16px; border-radius:50%; border:2px solid var(--textMuted); flex:none; }
.li.sel .radio { border-color:var(--accent); box-shadow:inset 0 0 0 3px var(--bg); background:var(--accent); }
.tag { font-size:11px; padding:1px 7px; border-radius:10px; background:var(--surface); border:1px solid var(--border); color:var(--textMuted); white-space:nowrap; }
.segc { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.segc span { padding:6px 14px; } .segc span.on { background:var(--accentSoft); color:var(--accent); font-weight:600; }
.check { display:inline-flex; align-items:center; gap:8px; }
.box { width:16px; height:16px; border-radius:3px; border:2px solid var(--textMuted); }
.box.on { background:var(--accent); border-color:var(--accent); }
.hint { margin-top:10px; padding:8px 10px; border-radius:6px; background:var(--warningPanelBg); display:flex; gap:10px; align-items:center; }
.summary { margin-top:12px; padding:10px 12px; border-radius:6px; background:var(--surface); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.ok { color:var(--success); font-weight:700; }
.steps { display:flex; align-items:center; gap:6px; margin:6px 0 18px; flex-wrap:wrap; }
.step { display:flex; align-items:center; gap:6px; color:var(--textMuted); }
.step .c { width:22px; height:22px; border-radius:50%; border:2px solid var(--border); display:inline-flex; align-items:center; justify-content:center; font-size:11px; }
.step.done { color:var(--text); } .step.done .c { background:var(--success); border-color:var(--success); color:#fff; }
.step.cur { color:var(--text); font-weight:600; } .step.cur .c { border-color:var(--accent); border-top-color:transparent; }
.step + .step::before { content:""; width:24px; height:2px; background:var(--border); margin-right:6px; }
.bar { height:8px; border-radius:4px; background:var(--surface); border:1px solid var(--border); overflow:hidden; }
.bar > i { display:block; height:100%; background:var(--accent); }
.big { font-size:18px; font-weight:600; margin:0 0 4px; }
.kinds { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; }
.kind { border:1.5px solid var(--border); border-radius:8px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start; background:var(--bg); text-align:left; }
.kind.on { border-color:var(--accent); background:var(--accentSoft); }
.kind .radio { margin-top:2px; } .kind.on .radio { border-color:var(--accent); box-shadow:inset 0 0 0 3px var(--bg); background:var(--accent); }
.kind b { display:block; margin-bottom:2px; } .kind .small { display:block; }
.narrow .kinds { grid-template-columns:1fr; }
.narrow .kind { padding:8px 12px; }
.searchbar { display:flex; align-items:center; gap:6px; padding:6px 10px; border-top:1px solid var(--border); background:var(--surface); flex:none; flex-wrap:wrap; }
.searchbar .segc span { padding:4px 10px; font-size:12px; }
.fchip { display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border-radius:12px; background:var(--accentSoft); color:var(--accent); font-size:12px; white-space:nowrap; }
.stickyfoot { position:sticky; bottom:-20px; margin:0 -24px -20px; padding:12px 24px; background:var(--bg); border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; z-index:2; }
.empty { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; }
.empty .in { max-width:460px; }
.empty .ico { font-size:40px; color:var(--textMuted); }
.checks { text-align:left; margin:14px auto; display:inline-flex; flex-direction:column; gap:6px; }
/* settings */
.set { max-width:760px; margin:0 auto; }
.set h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--textMuted); margin:22px 0 8px; }
.srow { display:flex; align-items:center; gap:16px; padding:10px 0; border-bottom:1px solid var(--border); }
.srow .lab { width:240px; flex:none; }
.srow .lab .muted { display:block; font-size:12px; }
.sel-box { height:30px; display:inline-flex; align-items:center; gap:8px; padding:0 10px; border:1px solid var(--border); border-radius:4px; min-width:160px; justify-content:space-between; }
.switch { width:34px; height:18px; border-radius:9px; background:var(--border); position:relative; }
.switch.on { background:var(--accent); }
.switch::after { content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; }
.switch.on::after { left:18px; }
/* overlays */
.scrim { position:absolute; inset:0; background:rgba(0,0,0,.42); display:flex; align-items:center; justify-content:center; z-index:5; }
.dialog { width:480px; max-width:92%; background:var(--surfaceRaised); border-radius:10px; padding:20px 22px; box-shadow:var(--shadow); border:1px solid var(--border); }
.dialog h3 { margin:0 0 10px; font-size:16px; }
.dialog ul { margin:8px 0 10px 18px; padding:0; }
.dialog .acts { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
.popover { position:absolute; right:12px; top:44px; width:320px; background:var(--surfaceRaised); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow); padding:14px; z-index:4; }
.popover .srow .lab { width:150px; flex:1; }
.popover .sel-box { min-width:110px; }
.histpop { position:absolute; left:10px; bottom:50px; width:420px; background:var(--surfaceRaised); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow); z-index:4; }
.histpop .li { padding:6px 10px; }
.toast { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:8px 16px; border-radius:6px; box-shadow:var(--shadow); z-index:6; }
.kbdlist { display:grid; grid-template-columns:auto 1fr; gap:6px 18px; }
.kbdlist .k { font-family:ui-monospace, monospace; font-size:12px; padding:1px 6px; border:1px solid var(--border); border-radius:4px; background:var(--surface); justify-self:start; }
/* M4 wizards (0007-0010) */
.wiz { width:720px; max-width:calc(100% - 48px); height:560px; max-height:calc(100% - 48px); background:var(--surfaceRaised); border-radius:10px; box-shadow:var(--shadow); border:1px solid var(--border); display:flex; flex-direction:column; }
.wiz .wh { padding:14px 18px 10px; border-bottom:1px solid var(--border); }
.wiz .wh .tt { display:flex; align-items:center; font-size:16px; font-weight:600; }
.wiz .wb { flex:1; overflow:auto; padding:16px 22px; }
.wiz .wf { display:flex; gap:8px; padding:12px 18px; border-top:1px solid var(--border); align-items:center; }
.wsteps { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; font-size:12px; }
.wsteps .s { color:var(--textMuted); display:flex; align-items:center; gap:4px; }
.wsteps .s + .s::before { content:"—"; color:var(--border); margin-right:2px; }
.wsteps .s.done { color:var(--text); } .wsteps .s.done i { color:var(--success); font-style:normal; }
.wsteps .s.cur { color:var(--accent); font-weight:600; }
.wsteps.compact { display:none; } .narrow .wsteps.full { display:none; } .narrow .wsteps.compact { display:flex; }
.illu { width:100%; max-width:480px; aspect-ratio:16/9; border:1.5px dashed var(--border); border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--textMuted); font-size:40px; background:var(--surface); margin:0 0 12px; }
.narrow .illu { max-width:300px; }
.clist { display:flex; flex-direction:column; border:1px solid var(--border); border-radius:6px; overflow:hidden; margin:10px 0; }
.crow { display:flex; gap:10px; padding:8px 12px; border-top:1px solid var(--border); align-items:flex-start; }
.crow:first-child { border-top:0; }
.narrow .crow { padding:6px 12px; }
.crow .st { width:18px; flex:none; font-weight:700; text-align:center; }
.crow .st.ok { color:var(--success); } .crow .st.w { color:var(--warning); } .crow .st.f { color:var(--error); } .crow .st.s, .crow .st.p { color:var(--textMuted); }
.crow .ti { width:220px; flex:none; font-weight:600; }
.crow .ex { margin-top:4px; font-size:12px; }
.cmd { background:var(--consoleBg); border:1px solid var(--border); border-radius:6px; padding:6px 8px; margin:8px 0; }
.cmd .cl { display:flex; gap:8px; align-items:center; padding:3px 0; }
.cmd .cl code { flex:1; white-space:pre-wrap; word-break:break-all; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:12px; }
.menu { position:absolute; left:76px; bottom:12px; width:280px; background:var(--surfaceRaised); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow); padding:6px 0; z-index:4; }
.narrow .menu { left:56px; }
.menu .mi { display:flex; justify-content:space-between; padding:7px 14px; }
.menu .mi:hover { background:var(--surface); }
.menu hr { border:0; border-top:1px solid var(--border); margin:4px 0; }
.report { height:220px; overflow:auto; background:var(--consoleBg); border:1px solid var(--border); border-radius:6px; padding:8px 10px; white-space:pre; margin:10px 0; }
@media (max-width: 700px) { .review { padding:10px 16px; } }
</style>
</head>
<body>
<div class="review" role="toolbar" aria-label="Mockup controls">
  <b>Screen</b><div class="screens" id="screens"></div>
  <span><b>Theme</b><span class="seg" id="themeSeg"><button data-v="light">Light</button><button data-v="dark">Dark</button></span></span>
  <span><b>Lang</b><span class="seg" id="langSeg"><button data-v="en">EN</button><button data-v="cs">CS</button></span></span>
  <span><b>Window</b><span class="seg" id="sizeSeg"><button data-v="wide">1280×800</button><button data-v="narrow">960×600 (min)</button></span></span>
</div>
<p class="note" id="note"></p>
<div class="stage"><div class="win" id="win"></div></div>

<script>
const S = { screen:'console', lang:'en', size:'wide',
  theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' };
try { Object.assign(S, JSON.parse(localStorage.getItem('hioMockup') || '{}')); } catch (e) {}

/* ---------- strings (EN source, CS draft for layout checks) ---------- */
const T = {
 en:{ console:'Console', flash:'Flash', settings:'Settings', help:'Help', probe:'Probe', target:'Target',
  connect:'Connect', disconnect:'Disconnect', cancel:'Cancel', connected:'Connected', connecting:'Connecting…',

const ICON = { console:'▤', flash:'⚡', settings:'⚙', help:'?' };
function tabbar(active, st) {
  const tabs = [

  ];
  return `<div class="tabbar" role="tablist">${tabs.map((x,i)=>`<div class="tab ${i===0?'active':''}" role="tab" aria-selected="${i===0}">
    <span class="dot ${x.dot}"></span>${esc(i===0&&active==='choose'?t('newTab'):x.title)}<span class="x">×</span></div>`).join('')}
    <button class="tab-add" title="${t('newTab')} (Ctrl+T)" aria-label="${t('newTab')}">+</button></div>`;
}
function rail(page, busy) {
  const it = (k, sel, badge) => `<button class="item ${sel?'sel':''}" title="${t(k)}"><span class="ic">${ICON[k]}</span><span class="l">${t(k)}</span>${badge?'<span class="badge"></span>':''}</button>`;
  return `<nav class="rail" aria-label="${t('pages')}">${it('console', page==='console', busy)}${it('flash', page==='flash')}<div class="spacer"></div>${it('settings', page==='settings')}${it('help')}</nav>`;
}
function devbar(state, extra='') {
  const map = {
    on:  [`<span class="dot ok"></span>${t('connected')} · 3.30 V`, `<button class="btn">${t('disconnect')}</button>`],
    off: [`<span class="dot"></span>${t('disconnected')}`, `<button class="btn primary">${t('connect')}</button>`],
    err: [`<span class="dot err"></span>${t('reconnecting')}`, `<button class="btn">${t('disconnect')}</button>`],
    busy:[`<span class="dot busy"></span>${t('flashing')}`, `<button class="btn" disabled>${t('disconnect')}</button>`],
    choose:[`<span class="muted">${t('chooseDevice')}</span>`, ''],
  }[state];
  const probe = state==='choose' ? '' : `<span class="chip"><span class="k">${t('probe')}</span> J-Link EDU Mini · <span class="mono">683012345</span></span>
    <span class="chip"><span class="k">${t('target')}</span> CHESTER · app ▾</span>`;
  return `<div class="devbar">${probe}<span class="state">${map[0]}</span><span class="grow"></span>${map[1]}
    ${state==='choose'?'':`<button class="btn ghost" title="${t('advanced')}" aria-label="${t('advanced')}">⋯</button>`}</div>${extra}`;
}
function frame({page, dev, busy, tabState, content, overlay=''}) {

}

   <div class="lines">${lines}${opts.hist?histPopup():''}</div>
   ${opts.find?`<div class="searchbar" role="search"><span class="segc"><span class="on">${t('mSearch')}</span></span><div class="field focus" style="max-width:300px"><span>lte</span><span class="grow"></span><span class="tog">Aa</span><span class="tog">.*</span></div><span class="small">1 / 2</span><button class="tb">↑</button><button class="tb">↓</button><button class="tb">×</button></div>`:''}
   <div class="input"><div class="field mono ${opts.disabled?'':'focus'}">${opts.disabled?`<span class="ph">${esc(opts.disabled)}</span>`:`<span style="color:var(--accent)">&gt;</span><span class="ph">${t('inputPh')}</span>`}</div>
   <button class="btn primary" ${opts.disabled?'disabled':''}>${t('send')}</button></div></section>`;
}
function histPopup() {
  const h = ['lte state','lte config show','app config show','app config interval-report 900','lte test reset'];
  return `<div class="histpop"><div class="panehead"><b>${t('histTitle')}</b></div><div class="field focus mono" style="margin:8px">lte</div>
   ${h.filter(x=>x.includes('lte')).map((x,i)=>`<div class="li mono ${i===0?'sel':''}">${hl(x,'lte')}</div>`).join('')}</div>`;
}
function logPane(opts={}) {
  // opts.mode: 'search' | 'filter'; opts.find: search query active; opts.filter: filter active
  const mode = opts.mode || 'search';
  const q = opts.find ? 'Uplink' : '';
  let first = true;
  const rows = logLines.filter(r => !opts.filter || (r[0]!=='D' && r[2].includes('ctr_'))).map(([lv,ts,s],i) => {
    const has = q && s.includes(q); const cur = has && first; if (has) first = false;
    return `<div class="ln mono ${lv} ${i===2&&opts.sel?'sel':''}"><span class="t">${ts}</span><span class="lv">${lv}</span><span>${hl(s.replace(/^<\w+> /,''), q, cur)}</span></div>`;
  }).join('');
  const field = mode==='search'
    ? `<div class="field ${opts.find?'focus':''}" style="max-width:340px">${opts.find?'<span>Uplink</span>':`<span class="ph">${t('searchPh')}</span>`}<span class="grow"></span><span class="tog">Aa</span><span class="tog">.*</span></div>
       ${opts.find?`<span class="small">3 / 128</span><button class="tb" aria-label="${t('prevMatch')} (Shift+N)">↑</button><button class="tb" aria-label="${t('nextMatch')} (N)">↓</button><button class="tb" aria-label="${t('close')} (Esc)">×</button>`:''}
       ${opts.filter?`<span class="fchip">${t('filterOn')} <span>×</span></span>`:''}`
    : `<div class="field focus" style="max-width:340px"><span>ctr_</span><span class="grow"></span><span class="tog">Aa</span><span class="tog">.*</span></div>
       <span class="small muted">${t('showing')}</span><button class="tb small">${t('clearFilter')}</button>`;
  const bar = `<div class="searchbar" role="search"><span class="segc"><span class="${mode==='search'?'on':''}">${t('mSearch')}</span><span class="${mode==='filter'?'on':''}">${t('mFilter')}</span></span>
     ${field}<span class="grow"></span>
     <span class="levels" aria-label="${t('levels')}"><span class="lvchip ${opts.filter?'':'on'}">D</span><span class="lvchip on">I</span><span class="lvchip on">W</span><span class="lvchip on">E</span></span></div>`;
  return `<section class="pane" aria-label="${t('log')}"><div class="panehead"><b>${t('log')}</b><span>98 311 ${t('lines')}</span></div>
    <div class="lines">${rows}${opts.pill?`<span class="pill">${t('newLines')}</span>`:''}</div>${bar}</section>`;
}
function consoleToolbar(following=true) {

   <button class="tb" title="${t('reset')}">⟲ <span class="lbl">${t('reset')} ▾</span></button>
   <button class="tb" title="${t('reconnect')} (F4)">↻ <span class="lbl">${t('reconnect')}</span> <span class="kbd">F4</span></button>
   <button class="tb" title="${t('batch')} (Ctrl+B)">≡ <span class="lbl">${t('batch')}</span></button>

/* ---------- wiring ---------- */
function seg(id, key) {
  document.querySelectorAll(`#${id} button`).forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.v === S[key]));
    b.onclick = () => { S[key] = b.dataset.v; render(); };
  });
}
function render() {
  document.documentElement.dataset.theme = S.theme;
  document.documentElement.lang = S.lang;
  if (!SCREENS[S.screen]) S.screen = 'console';
  const sc = document.getElementById('screens');
  sc.innerHTML = Object.entries(SCREENS).map(([k,v]) => `<button data-v="${k}" aria-pressed="${k===S.screen}">${v.label}</button>`).join('');
  sc.querySelectorAll('button').forEach(b => b.onclick = () => { S.screen = b.dataset.v; render(); });
  seg('themeSeg','theme'); seg('langSeg','lang'); seg('sizeSeg','size');
  const win = document.getElementById('win');
  win.className = 'win' + (S.size === 'narrow' ? ' narrow' : '');
  win.innerHTML = SCREENS[S.screen].render();
  document.getElementById('note').textContent = SCREENS[S.screen].note;
  try { localStorage.setItem('hioMockup', JSON.stringify(S)); } catch (e) {}
}
render();
</script>
