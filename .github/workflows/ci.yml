# HARDWARIO Monitor v2 - continuous integration (plan/features/0001-m0-skeleton.md, phase E).
#
# Every third-party action is pinned by its full commit SHA (the tag is in the comment); update
# both together. Toolchains: LLVM 21 (ADR-0021), Qt 6.8 LTS official binaries via aqtinstall
# (ADR-0002), CMake presets from CMakePresets.json.
name: CI

on:
  pull_request:
  push:
    # TEMPORARY (plan 0023): CI for the repair branch; removed before merging into v2-dev.
    branches: [v2-dev, strnad/ci-repair-90059f]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  AQT_VERSION: "==3.3.0"
  LLVM_MAJOR: "21"
  # Windows: official LLVM installer; SHA-256 from the GitHub release asset digest of
  # llvmorg-21.1.8 (LLVM-21.1.8-win64.exe).
  LLVM_WINDOWS_VERSION: "21.1.8"
  LLVM_WINDOWS_SHA256: "7a5386c26497db1691f320121e5b113364dd0274b98e55f15f4dbc00c0450113"
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  lint:
    name: lint (format, translations, LFS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      # Errors as annotations (compiler, CMake, GoogleTest, Qt Test, packaging tools).
      - name: Problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"
      - name: Git LFS rule
        run: tools/check-lfs.sh
      - name: Portable includes (no <bits/...>)
        run: tools/check-includes.sh
      - name: Install LLVM ${{ env.LLVM_MAJOR }}
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_MAJOR} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-${LLVM_MAJOR} clang-format-${LLVM_MAJOR} ninja-build libgl1-mesa-dev libxkbcommon-dev
      - name: clang-format
        run: |
          git ls-files -z -- '*.h' '*.cpp' | xargs -0 clang-format-${LLVM_MAJOR} --dry-run --Werror
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity # Qt Bluetooth (plan 0011, ADR-0080)
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('cmake/HioDeps.cmake') }}
      - name: Translation catalogs are up to date
        run: |
          cmake --preset linux-debug -DHIO_BUILD_TESTS=OFF
          cmake --build --preset linux-debug --target check_translations

  linux:
    name: linux-${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan, tsan, coverage, tidy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # LFS objects come from the cache below, then `git lfs pull`
      # Errors as annotations (compiler, CMake, GoogleTest, Qt Test, packaging tools).
      - name: Problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"
      # The bundled GUI fonts (ADR-0048) are LFS objects: cache .git/lfs keyed by the LFS object list
      # (review S22: LFS bandwidth quota), then fetch only what the cache does not have.
      - name: LFS object list
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id', '.gitattributes') }}
      - name: Git LFS pull
        shell: bash
        run: git lfs pull
      - name: Install LLVM ${{ env.LLVM_MAJOR }} and build tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_MAJOR} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-${LLVM_MAJOR} clang-tidy-${LLVM_MAJOR} llvm-${LLVM_MAJOR} \
            libclang-rt-${LLVM_MAJOR}-dev ninja-build \
            libgl1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - name: Czech locale
        # CliProcess.CzechLocaleStaysEnglish runs `hio` under cs_CZ.UTF-8; the runner image only
        # has C.UTF-8 and en_US.UTF-8 (plan 0023).
        run: sudo locale-gen cs_CZ.UTF-8
      - name: glibc debug symbols (TSan)
        if: matrix.preset == 'tsan'
        # The race:tzset_internal suppression (plan 0019) matches a static glibc function, which the
        # stripped libc.so.6 of the runner image does not name without its debug info (plan 0023).
        run: sudo apt-get install -y --no-install-recommends libc6-dbg
      - name: Allow TSan memory mappings
        if: matrix.preset == 'tsan'
        # TSan cannot map its shadow memory with the runner's high ASLR entropy.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity # Qt Bluetooth (plan 0011, ADR-0080)
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('cmake/HioDeps.cmake') }}
      - name: Configure
        shell: bash
        run: |
          cmake --preset linux-${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/configure.log"
      - name: Build
        shell: bash
        run: cmake --build --preset linux-${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Test
        run: ctest --preset linux-${{ matrix.preset }} --output-on-failure
      - name: TEMPORARY failure notes (plan 0023)
        if: failure()
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" .github/ci-failure-notes.py "build/linux-${{ matrix.preset }}" \
            "$RUNNER_TEMP/configure.log" "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/coverage.log"
      - name: QML lint
        if: matrix.preset == 'debug'
        run: cmake --build --preset linux-debug --target all_qmllint
      - name: Coverage report
        if: matrix.preset == 'coverage'
        shell: bash
        run: |
          exec > >(tee "$RUNNER_TEMP/coverage.log") 2>&1
          build_dir=build/linux-coverage
          llvm-profdata-${LLVM_MAJOR} merge -sparse "${build_dir}"/profiles/*.profraw \
            -o "${build_dir}/coverage.profdata"
          objects=(
            "${build_dir}/libs/core/tests/hio_core_tests"
            -object "${build_dir}/app/cli/tests/hio_cli_tests"
            -object "${build_dir}/app/cli/hio"
            -object "${build_dir}/app/gui/tests/tst_gui"
          )
          ignore='(\.cpm-cache|/build/|/tests/)'
          llvm-cov-${LLVM_MAJOR} show "${objects[@]}" -instr-profile="${build_dir}/coverage.profdata" \
            -ignore-filename-regex="${ignore}" -format=html -output-dir="${build_dir}/coverage-html"
          llvm-cov-${LLVM_MAJOR} export "${objects[@]}" -instr-profile="${build_dir}/coverage.profdata" \
            -ignore-filename-regex="${ignore}" -format=lcov > "${build_dir}/coverage.lcov"
          llvm-cov-${LLVM_MAJOR} report "${objects[@]}" -instr-profile="${build_dir}/coverage.profdata" \
            -ignore-filename-regex="${ignore}"
      - name: Upload coverage
        if: matrix.preset == 'coverage'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            build/linux-coverage/coverage-html
            build/linux-coverage/coverage.lcov
      - name: TEMPORARY coverage failure notes (plan 0023)
        if: failure() && matrix.preset == 'coverage'
        shell: bash
        run: python3 .github/ci-failure-notes.py build/none "$RUNNER_TEMP/coverage.log"

  fuzz:
    # ADR-0152: libFuzzer smoke run of the MCP HTTP parser and JSON-RPC handling, 60 s per target.
    name: linux-fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # the fuzz targets and seed corpora need no LFS objects
      # Errors as annotations (compiler, CMake, GoogleTest, Qt Test, packaging tools).
      - name: Problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"
      - name: Install LLVM ${{ env.LLVM_MAJOR }} and build tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_MAJOR} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-${LLVM_MAJOR} llvm-${LLVM_MAJOR} libclang-rt-${LLVM_MAJOR}-dev ninja-build \
            libgl1-mesa-dev libxkbcommon-dev
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity # Qt Bluetooth (plan 0011, ADR-0080)
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('cmake/HioDeps.cmake') }}
      - name: Configure
        run: cmake --preset linux-fuzz
      - name: Build
        run: cmake --build --preset linux-fuzz
      - name: Fuzz (60 s per target)
        # libFuzzer symbolizes new functions with llvm-symbolizer; a configured debuginfod server
        # makes each lookup block for a long time (seen locally: about 100 s), so it is disabled
        # here as in the sanitizer test presets.
        env:
          DEBUGINFOD_URLS: ""
        run: |
          mkdir -p fuzz-artifacts
          for target in http_parser_fuzz json_rpc_fuzz; do
            work="$RUNNER_TEMP/corpus-$target"
            mkdir -p "$work"
            # New inputs go to the temporary directory; the committed seeds are read only.
            "build/linux-fuzz/libs/mcp/fuzz/$target" -max_total_time=60 -print_final_stats=1 \
              -artifact_prefix="fuzz-artifacts/$target-" "$work" "libs/mcp/fuzz/corpus/$target"
          done
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts

  macos:
    name: macos-${{ matrix.preset }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # LFS objects come from the cache below, then `git lfs pull`
      # Errors as annotations (compiler, CMake, GoogleTest, Qt Test, packaging tools).
      - name: Problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"
      # The bundled GUI fonts (ADR-0048) are LFS objects: cache .git/lfs keyed by the LFS object list
      # (review S22: LFS bandwidth quota), then fetch only what the cache does not have.
      - name: LFS object list
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id', '.gitattributes') }}
      - name: Git LFS pull
        shell: bash
        run: git lfs pull
      - name: Build tools
        run: brew install ninja
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity # Qt Bluetooth (plan 0011, ADR-0080)
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('cmake/HioDeps.cmake') }}
      - name: Configure
        shell: bash
        run: |
          cmake --preset macos-${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/configure.log"
      - name: Build
        shell: bash
        run: cmake --build --preset macos-${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Test
        run: ctest --preset macos-${{ matrix.preset }} --output-on-failure
      - name: TEMPORARY failure notes (plan 0023)
        if: failure()
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" .github/ci-failure-notes.py "build/macos-${{ matrix.preset }}" \
            "$RUNNER_TEMP/configure.log" "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/coverage.log"

  windows:
    name: windows-${{ matrix.preset }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # LFS objects come from the cache below, then `git lfs pull`
      # Errors as annotations (compiler, CMake, GoogleTest, Qt Test, packaging tools).
      - name: Problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"
      # The bundled GUI fonts (ADR-0048) are LFS objects: cache .git/lfs keyed by the LFS object list
      # (review S22: LFS bandwidth quota), then fetch only what the cache does not have.
      - name: LFS object list
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id', '.gitattributes') }}
      - name: Git LFS pull
        shell: bash
        run: git lfs pull
      - name: Install LLVM ${{ env.LLVM_WINDOWS_VERSION }} (checksum verified)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_WINDOWS_VERSION-win64.exe"
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_WINDOWS_VERSION/LLVM-$env:LLVM_WINDOWS_VERSION-win64.exe" -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($hash -ne $env:LLVM_WINDOWS_SHA256) { throw "LLVM installer checksum mismatch: $hash" }
          $target = "C:\llvm-$env:LLVM_WINDOWS_VERSION"
          Start-Process -FilePath $installer -ArgumentList "/S", "/D=$target" -Wait
          "$target\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity # Qt Bluetooth (plan 0011, ADR-0080)
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('cmake/HioDeps.cmake') }}
      - name: Configure
        shell: bash
        run: |
          clang-cl --version
          cmake --preset windows-${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/configure.log"
      - name: Build
        shell: bash
        run: cmake --build --preset windows-${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Test
        run: ctest --preset windows-${{ matrix.preset }} --output-on-failure
      - name: TEMPORARY failure notes (plan 0023)
        if: failure()
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" .github/ci-failure-notes.py "build/windows-${{ matrix.preset }}" \
            "$RUNNER_TEMP/configure.log" "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/coverage.log"
      - name: TEMPORARY death test probe (plan 0023)
        if: failure() && matrix.preset == 'debug'
        shell: bash
        run: |
          exe=$(find build/windows-debug -name hio_gui_tests.exe | head -n 1)
          status=0
          /usr/bin/timeout 90 "$exe" --gtest_filter=PageRegistry.DuplicatePageIsAProgrammingError \
            > "$RUNNER_TEMP/death.log" 2>&1 || status=$?
          echo "exit $status" >> "$RUNNER_TEMP/death.log"
          py=$(command -v python3 || command -v python)
          "$py" .github/ci-failure-notes.py build/none "$RUNNER_TEMP/death.log"
