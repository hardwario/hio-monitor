# HARDWARIO Monitor v2 - continuous integration (plan/features/0001-m0-skeleton.md, phase E).
#
# Every third-party action is pinned by its full commit SHA (the tag is in the comment); update
# both together. Toolchains: LLVM 21 (ADR-0021), Qt 6.8 LTS official binaries via aqtinstall
# (ADR-0002), CMake presets from CMakePresets.json.
name: CI

on:
  pull_request:
  push:
    # v2/m7-packaging: TEMPORARY, so that the package jobs of plan 0015 run on the branch before a
    # pull request exists (the branch has no PR yet); remove when the branch is merged.
    branches: [v2-dev, v2/m7-packaging]
  # release.yml runs the whole matrix as its gate (plan/features/0015 F2, ADR-0125).
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  AQT_VERSION: "==3.3.0"
  LLVM_MAJOR: "21"
  # Windows: official LLVM installer; SHA-256 from the GitHub release asset digest of
  # llvmorg-21.1.8 (LLVM-21.1.8-win64.exe).
  LLVM_WINDOWS_VERSION: "21.1.8"
  LLVM_WINDOWS_SHA256: "7a5386c26497db1691f320121e5b113364dd0274b98e55f15f4dbc00c0450113"
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  # Packaging (plan/features/0015): WiX >= 4 (MSI through CPack, CMake >= 3.30) and create-dmg
  # (DMG layout), both pinned; the create-dmg release archive is checked by its SHA-256.
  WIX_VERSION: "5.0.2"
  CREATE_DMG_VERSION: "1.2.2"
  CREATE_DMG_SHA256: "18e8dd7db06c9d6fb590c7877e1714b79b709f17d1d138bd65e4910cc82391bc"

jobs:
  lint:
    name: lint (format, translations, LFS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      # Errors as annotations (compiler, CMake, GoogleTest, Qt Test, packaging tools).
      - name: Problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"
      - name: Git LFS rule
        run: tools/check-lfs.sh
      - name: Portable includes (no <bits/...>)
        run: tools/check-includes.sh
      - name: Install LLVM ${{ env.LLVM_MAJOR }}
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_MAJOR} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-${LLVM_MAJOR} clang-format-${LLVM_MAJOR} ninja-build libgl1-mesa-dev libxkbcommon-dev
      - name: clang-format
        run: |
          git ls-files -z -- '*.h' '*.cpp' | xargs -0 clang-format-${LLVM_MAJOR} --dry-run --Werror
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity # Qt Bluetooth (plan 0011, ADR-0080)
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('cmake/HioDeps.cmake') }}
      - name: Translation catalogs are up to date
        run: |
          cmake --preset linux-debug -DHIO_BUILD_TESTS=OFF
          cmake --build --preset linux-debug --target check_translations

  linux:
    name: linux-${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan, tsan, coverage, tidy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # LFS objects come from the cache below, then `git lfs pull`
      # Errors as annotations (compiler, CMake, GoogleTest, Qt Test, packaging tools).
      - name: Problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"
      # The bundled GUI fonts (ADR-0048) are LFS objects: cache .git/lfs keyed by the LFS object list
      # (review S22: LFS bandwidth quota), then fetch only what the cache does not have.
      - name: LFS object list
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id', '.gitattributes') }}
      - name: Git LFS pull
        shell: bash
        run: git lfs pull
      - name: Install LLVM ${{ env.LLVM_MAJOR }} and build tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_MAJOR} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-${LLVM_MAJOR} clang-tidy-${LLVM_MAJOR} llvm-${LLVM_MAJOR} \
            libclang-rt-${LLVM_MAJOR}-dev ninja-build \
            libgl1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - name: Allow TSan memory mappings
        if: matrix.preset == 'tsan'
        # TSan cannot map its shadow memory with the runner's high ASLR entropy.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity # Qt Bluetooth (plan 0011, ADR-0080)
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('cmake/HioDeps.cmake') }}
      - name: Configure
        run: cmake --preset linux-${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset linux-${{ matrix.preset }}
      - name: Test
        run: ctest --preset linux-${{ matrix.preset }} --output-on-failure
      - name: QML lint
        if: matrix.preset == 'debug'
        run: cmake --build --preset linux-debug --target all_qmllint
      - name: Coverage report
        if: matrix.preset == 'coverage'
        run: |
          build_dir=build/linux-coverage
          llvm-profdata-${LLVM_MAJOR} merge -sparse "${build_dir}"/profiles/*.profraw \
            -o "${build_dir}/coverage.profdata"
          objects=(
            "${build_dir}/libs/core/tests/hio_core_tests"
            -object "${build_dir}/app/cli/tests/hio_cli_tests"
            -object "${build_dir}/app/cli/hio"
            -object "${build_dir}/app/gui/tst_gui"
          )
          ignore='(\.cpm-cache|/build/|/tests/)'
          llvm-cov-${LLVM_MAJOR} show "${objects[@]}" -instr-profile="${build_dir}/coverage.profdata" \
            -ignore-filename-regex="${ignore}" -format=html -output-dir="${build_dir}/coverage-html"
          llvm-cov-${LLVM_MAJOR} export "${objects[@]}" -instr-profile="${build_dir}/coverage.profdata" \
            -ignore-filename-regex="${ignore}" -format=lcov > "${build_dir}/coverage.lcov"
          llvm-cov-${LLVM_MAJOR} report "${objects[@]}" -instr-profile="${build_dir}/coverage.profdata" \
            -ignore-filename-regex="${ignore}"
      - name: Upload coverage
        if: matrix.preset == 'coverage'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            build/linux-coverage/coverage-html
            build/linux-coverage/coverage.lcov

  fuzz:
    # ADR-0152: libFuzzer smoke run of the MCP HTTP parser and JSON-RPC handling, 60 s per target;
    # plan 0021: the catalog page parser, 10 min.
    name: linux-fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # the fuzz targets and seed corpora need no LFS objects
      # Errors as annotations (compiler, CMake, GoogleTest, Qt Test, packaging tools).
      - name: Problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"
      - name: Install LLVM ${{ env.LLVM_MAJOR }} and build tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_MAJOR} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-${LLVM_MAJOR} llvm-${LLVM_MAJOR} libclang-rt-${LLVM_MAJOR}-dev ninja-build \
            libgl1-mesa-dev libxkbcommon-dev
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity # Qt Bluetooth (plan 0011, ADR-0080)
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('cmake/HioDeps.cmake') }}
      - name: Configure
        run: cmake --preset linux-fuzz
      - name: Build
        run: cmake --build --preset linux-fuzz
      - name: Fuzz (60 s per target)
        # libFuzzer symbolizes new functions with llvm-symbolizer; a configured debuginfod server
        # makes each lookup block for a long time (seen locally: about 100 s), so it is disabled
        # here as in the sanitizer test presets.
        env:
          DEBUGINFOD_URLS: ""
        run: |
          mkdir -p fuzz-artifacts
          for target in http_parser_fuzz json_rpc_fuzz; do
            work="$RUNNER_TEMP/corpus-$target"
            mkdir -p "$work"
            # New inputs go to the temporary directory; the committed seeds are read only.
            "build/linux-fuzz/libs/mcp/fuzz/$target" -max_total_time=60 -print_final_stats=1 \
              -artifact_prefix="fuzz-artifacts/$target-" "$work" "libs/mcp/fuzz/corpus/$target"
          done
      - name: Fuzz the catalog page parser (10 min, plan 0021)
        env:
          DEBUGINFOD_URLS: ""
        run: |
          mkdir -p fuzz-artifacts
          target=catalog_page_fuzz
          work="$RUNNER_TEMP/corpus-$target"
          mkdir -p "$work"
          "build/linux-fuzz/libs/firmware/fuzz/$target" -max_total_time=600 -print_final_stats=1 \
            -artifact_prefix="fuzz-artifacts/$target-" "$work" "libs/firmware/fuzz/corpus/$target"
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts

  macos:
    name: macos-${{ matrix.preset }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # LFS objects come from the cache below, then `git lfs pull`
      # Errors as annotations (compiler, CMake, GoogleTest, Qt Test, packaging tools).
      - name: Problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"
      # The bundled GUI fonts (ADR-0048) are LFS objects: cache .git/lfs keyed by the LFS object list
      # (review S22: LFS bandwidth quota), then fetch only what the cache does not have.
      - name: LFS object list
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id', '.gitattributes') }}
      - name: Git LFS pull
        shell: bash
        run: git lfs pull
      - name: Build tools
        run: brew install ninja
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity # Qt Bluetooth (plan 0011, ADR-0080)
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('cmake/HioDeps.cmake') }}
      - name: Configure
        run: cmake --preset macos-${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset macos-${{ matrix.preset }}
      - name: Test
        run: ctest --preset macos-${{ matrix.preset }} --output-on-failure

  windows:
    name: windows-${{ matrix.preset }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # LFS objects come from the cache below, then `git lfs pull`
      # Errors as annotations (compiler, CMake, GoogleTest, Qt Test, packaging tools).
      - name: Problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"
      # The bundled GUI fonts (ADR-0048) are LFS objects: cache .git/lfs keyed by the LFS object list
      # (review S22: LFS bandwidth quota), then fetch only what the cache does not have.
      - name: LFS object list
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id', '.gitattributes') }}
      - name: Git LFS pull
        shell: bash
        run: git lfs pull
      - name: Install LLVM ${{ env.LLVM_WINDOWS_VERSION }} (checksum verified)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_WINDOWS_VERSION-win64.exe"
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_WINDOWS_VERSION/LLVM-$env:LLVM_WINDOWS_VERSION-win64.exe" -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($hash -ne $env:LLVM_WINDOWS_SHA256) { throw "LLVM installer checksum mismatch: $hash" }
          $target = "C:\llvm-$env:LLVM_WINDOWS_VERSION"
          Start-Process -FilePath $installer -ArgumentList "/S", "/D=$target" -Wait
          "$target\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity # Qt Bluetooth (plan 0011, ADR-0080)
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('cmake/HioDeps.cmake') }}
      - name: Configure
        run: |
          clang-cl --version
          cmake --preset windows-${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset windows-${{ matrix.preset }}
      - name: Test
        run: ctest --preset windows-${{ matrix.preset }} --output-on-failure

  # ---- Packages (plan/features/0015 F1, ADR-0125): unsigned, 7-day artifacts ----------------------

  package-linux:
    # Ubuntu 22.04 build container (ADR-0121, ADR-0177: g++-13 / libstdc++ 13): .deb and AppImage
    # from one build tree, then lintian, desktop-file-validate, appstreamcli, the glibc ceiling and
    # smoke tests in clean ubuntu:22.04 / ubuntu:24.04 containers.
    name: package-linux
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # LFS objects come from the cache below, then `git lfs pull`
      # Errors as annotations (compiler, CMake, GoogleTest, Qt Test, packaging tools).
      - name: Problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"
      - name: LFS object list
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id', '.gitattributes') }}
      - name: Git LFS pull
        shell: bash
        run: git lfs pull
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('cmake/HioDeps.cmake') }}
      # The image is cached by the hash of its Containerfile (never published).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: image-cache
        with:
          path: ${{ runner.temp }}/build-image.tar
          key: build-image-${{ hashFiles('packaging/linux/Containerfile') }}
      - name: Build image
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          docker build -t hio-monitor-build:22.04 -f packaging/linux/Containerfile packaging/linux
          docker save hio-monitor-build:22.04 -o "$RUNNER_TEMP/build-image.tar"
      - name: Load image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/build-image.tar"
      - name: Build the .deb and the AppImage
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" \
            -e CPM_SOURCE_CACHE="$PWD/.cpm-cache" hio-monitor-build:22.04 \
            packaging/linux/build-packages.sh build/packages
      - name: Check the packages (glibc, lintian, desktop file, AppStream, AppImage CLI)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" hio-monitor-build:22.04 \
            packaging/linux/check-packages.sh build/packages
      - name: Smoke tests in clean containers
        run: packaging/linux/smoke-clean.sh build/packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux
          retention-days: 7
          path: |
            build/packages/*.deb
            build/packages/*.AppImage

  package-macos:
    # Universal bundle, ad-hoc inside-out signature with the hardened runtime and the entitlements
    # (ADR-0126), verified; DMG. Notarization only in release.yml.
    name: package-macos
    needs: macos
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      # Errors as annotations (compiler, CMake, GoogleTest, Qt Test, packaging tools).
      - name: Problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"
      - name: LFS object list
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id', '.gitattributes') }}
      - name: Git LFS pull
        shell: bash
        run: git lfs pull
      - name: Build tools
        run: |
          brew install ninja
          curl -fsSLo "$RUNNER_TEMP/create-dmg.tar.gz" \
            "https://github.com/create-dmg/create-dmg/archive/refs/tags/v${CREATE_DMG_VERSION}.tar.gz"
          echo "${CREATE_DMG_SHA256}  $RUNNER_TEMP/create-dmg.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/create-dmg.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/create-dmg-${CREATE_DMG_VERSION}" >> "$GITHUB_PATH"
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('cmake/HioDeps.cmake') }}
      - name: Configure
        run: cmake --preset macos-package
      - name: Build
        run: cmake --build --preset macos-package
      - name: Install (macdeployqt)
        run: cmake --install build/macos-package --prefix build/macos-install
      - name: Installed-tree self-test
        env:
          QT_QPA_PLATFORM: offscreen
          HIO_NO_CRASH_HANDLER: "1"
        run: |
          app="build/macos-install/HARDWARIO Monitor.app"
          "$app/Contents/MacOS/hio" --version --json | tee version.json
          grep -q '"package":"macos-bundle"' version.json
          "$app/Contents/MacOS/hio-monitor" --self-test
          lipo -archs "$app/Contents/MacOS/hio-monitor" | grep -q "x86_64 arm64\|arm64 x86_64"
      - name: Sign ad-hoc and verify
        run: packaging/macos/sign-and-notarize.sh sign "build/macos-install/HARDWARIO Monitor.app" -
      - name: DMG
        run: |
          version="$("build/macos-install/HARDWARIO Monitor.app/Contents/MacOS/hio" --version --json \
            | python3 -I -c 'import json,sys; print(json.load(sys.stdin)["data"]["version"].replace("+", "."))')"
          packaging/macos/sign-and-notarize.sh dmg "build/macos-install/HARDWARIO Monitor.app" \
            "build/packages/hio-monitor-${version}-macos-universal.dmg" -
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-macos
          retention-days: 7
          path: build/packages/*.dmg

  package-windows:
    # windeployqt + app-local MSVC runtime, MSI through CPack WIX (WiX >= 4), ICE validation,
    # Trusted Signing in dry-run mode (no secrets in PR CI).
    name: package-windows
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      # Errors as annotations (compiler, CMake, GoogleTest, Qt Test, packaging tools).
      - name: Problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"
      - name: LFS object list
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id', '.gitattributes') }}
      - name: Git LFS pull
        shell: bash
        run: git lfs pull
      - name: Install LLVM ${{ env.LLVM_WINDOWS_VERSION }} (checksum verified)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_WINDOWS_VERSION-win64.exe"
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_WINDOWS_VERSION/LLVM-$env:LLVM_WINDOWS_VERSION-win64.exe" -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($hash -ne $env:LLVM_WINDOWS_SHA256) { throw "LLVM installer checksum mismatch: $hash" }
          $target = "C:\llvm-$env:LLVM_WINDOWS_VERSION"
          Start-Process -FilePath $installer -ArgumentList "/S", "/D=$target" -Wait
          "$target\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: WiX ${{ env.WIX_VERSION }}
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION"
          wix --version
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('cmake/HioDeps.cmake') }}
      - name: Configure
        run: |
          cmake --version
          cmake --preset windows-package
      - name: Build
        run: cmake --build --preset windows-package
      - name: Signing (dry run)
        shell: pwsh
        run: >-
          packaging/windows/sign.ps1 -DryRun -Files
          build/windows-package/app/gui/hio-monitor.exe,build/windows-package/app/cli/hio.exe
      - name: Installed-tree self-test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          HIO_NO_CRASH_HANDLER: "1"
        run: |
          cmake --install build/windows-package --prefix build/windows-install
          $json = & build/windows-install/hio.exe --version --json
          $json
          if ($json -notmatch '"package":"msi"') { throw "package kind is not msi" }
          $gui = Start-Process -FilePath build/windows-install/hio-monitor.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw "hio-monitor --self-test failed: $($gui.ExitCode)" }
          Get-ChildItem build/windows-install -Filter "vcruntime140*.dll"
      - name: MSI
        run: cpack --preset windows-package -B build/packages
      - name: ICE validation
        shell: pwsh
        run: |
          $msi = Get-ChildItem build/packages -Filter *.msi | Select-Object -First 1
          wix msi validate $msi.FullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows
          retention-days: 7
          path: build/packages/*.msi
