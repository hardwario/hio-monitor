# HARDWARIO Monitor v2 - release (plan/features/0015 F2, ADR-0125, ADR-0120, ADR-0123).
#
# A pushed tag v2.X.Y (or v2.X.Y-<pre-release>) builds, signs and checksums the packages and
# creates a DRAFT GitHub release with generated notes; a maintainer reviews and publishes it
# (packaging/RELEASE.md). Nothing is published automatically.
#
#   gate      the version computed from the tag equals the tag, 0 unfinished Czech translations,
#             HIO_TEST_OVERRIDES=OFF in the package configuration, and the full CI matrix
#             (ci.yml through workflow_call, incl. the unsigned package jobs)
#   linux     Ubuntu 22.04 container: .deb + AppImage, checks, split DWARF symbols
#   macos     universal bundle signed with the Developer ID (temporary keychain), DMG notarized
#             and stapled, .dSYM symbols
#   windows   executables and MSI signed with Azure Trusted Signing (OIDC), .pdb symbols
#   publish   SHA256SUMS, build provenance attestations, draft release
#
# Secrets live only in the environment `release` (required reviewers); names and rotation are in
# packaging/README.md. Every third-party action is pinned by its full commit SHA (tag in the
# comment), as in ci.yml.
name: Release

on:
  push:
    tags: ["v2.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  AQT_VERSION: "==3.3.0"
  LLVM_WINDOWS_VERSION: "21.1.8"
  LLVM_WINDOWS_SHA256: "7a5386c26497db1691f320121e5b113364dd0274b98e55f15f4dbc00c0450113"
  WIX_VERSION: "5.0.2"
  CREATE_DMG_VERSION: "1.2.2"
  CREATE_DMG_SHA256: "18e8dd7db06c9d6fb590c7877e1714b79b709f17d1d138bd65e4910cc82391bc"
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  gate:
    name: gate (version, translations, overrides)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
      - name: The version is the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v2\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Not a release tag: $tag" >&2; exit 1; }
          described="$(git describe --tags --match 'v2.*' --exact-match --dirty)"
          [ "$described" = "$tag" ] || { echo "git describe gives '$described', not '$tag'" >&2; exit 1; }
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install LLVM 21 and Qt build prerequisites
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21 ninja-build libgl1-mesa-dev libxkbcommon-dev
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity
          cache: true
      - name: Package configuration (version from the tag, HIO_TEST_OVERRIDES=OFF)
        run: |
          cmake --preset linux-package | tee configure.log
          grep -q "HARDWARIO Monitor version: ${{ steps.version.outputs.version }} " configure.log
          grep -q '^HIO_TEST_OVERRIDES:BOOL=OFF$' build/linux-package/CMakeCache.txt
      - name: 0 unfinished Czech translations (ADR-0027)
        run: |
          cmake --preset linux-debug -DHIO_BUILD_TESTS=OFF > /dev/null
          cmake --build --preset linux-debug --target check_translations | tee translations.log
          grep -q "Translations: 0 unfinished Czech" translations.log

  tests:
    name: tests (ci.yml)
    needs: gate
    uses: ./.github/workflows/ci.yml

  linux:
    name: linux (.deb, AppImage)
    needs: [gate, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
      - name: Build image
        run: docker build -t hio-monitor-build:22.04 -f packaging/linux/Containerfile packaging/linux
      - name: Build the .deb and the AppImage
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" \
            -e CPM_SOURCE_CACHE="$PWD/.cpm-cache" hio-monitor-build:22.04 \
            packaging/linux/build-packages.sh build/packages
      - name: Check the packages
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" hio-monitor-build:22.04 \
            packaging/linux/check-packages.sh build/packages
          packaging/linux/smoke-clean.sh build/packages
      - name: Symbols (split DWARF, ADR-0123)
        run: |
          version="${{ needs.gate.outputs.version }}"
          mkdir -p symbols
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" hio-monitor-build:22.04 bash -c '
            for exe in app/gui/hio-monitor app/cli/hio; do
              llvm-objcopy-21 --only-keep-debug "build/linux-package/$exe" "symbols/$(basename $exe).debug"
            done'
          (cd symbols && zip -9 "../build/packages/hio-monitor-${version}-symbols-linux.zip" *.debug)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: |
            build/packages/*.deb
            build/packages/*.AppImage
            build/packages/*-symbols-linux.zip

  macos:
    name: macos (DMG, signed and notarized)
    needs: [gate, tests]
    runs-on: macos-15
    timeout-minutes: 120
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
      - name: Build tools
        run: |
          brew install ninja
          curl -fsSLo "$RUNNER_TEMP/create-dmg.tar.gz" \
            "https://github.com/create-dmg/create-dmg/archive/refs/tags/v${CREATE_DMG_VERSION}.tar.gz"
          echo "${CREATE_DMG_SHA256}  $RUNNER_TEMP/create-dmg.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/create-dmg.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/create-dmg-${CREATE_DMG_VERSION}" >> "$GITHUB_PATH"
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity
          cache: true
      - name: Build and install
        run: |
          cmake --preset macos-package
          cmake --build --preset macos-package
          cmake --install build/macos-package --prefix build/macos-install
      - name: Signing identity (temporary keychain)
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -n 1 | awk '{print $2}')"
          [ -n "$identity" ] || { echo "No Developer ID Application identity" >&2; exit 1; }
          echo "MACOS_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Sign, DMG, notarize, staple
        env:
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          app="build/macos-install/HARDWARIO Monitor.app"
          dmg="build/packages/hio-monitor-${{ needs.gate.outputs.version }}-macos-universal.dmg"
          packaging/macos/sign-and-notarize.sh sign "$app" "$MACOS_IDENTITY"
          spctl -a -t exec -vv "$app" || true # Gatekeeper accepts it only after notarization
          packaging/macos/sign-and-notarize.sh dmg "$app" "$dmg" "$MACOS_IDENTITY"
          packaging/macos/sign-and-notarize.sh notarize "$dmg"
      - name: Symbols (.dSYM, ADR-0123)
        run: |
          mkdir -p symbols
          dsymutil build/macos-package/app/gui/hio-monitor.app/Contents/MacOS/hio-monitor -o symbols/hio-monitor.dSYM
          dsymutil build/macos-package/app/cli/hio -o symbols/hio.dSYM
          (cd symbols && zip -9 -r "../build/packages/hio-monitor-${{ needs.gate.outputs.version }}-symbols-macos.zip" .)
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            build/packages/*.dmg
            build/packages/*-symbols-macos.zip

  windows:
    name: windows (MSI, signed)
    needs: [gate, tests]
    runs-on: windows-2022
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC login to Azure (Trusted Signing, ADR-0120)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
      - name: Install LLVM ${{ env.LLVM_WINDOWS_VERSION }} (checksum verified)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_WINDOWS_VERSION-win64.exe"
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_WINDOWS_VERSION/LLVM-$env:LLVM_WINDOWS_VERSION-win64.exe" -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($hash -ne $env:LLVM_WINDOWS_SHA256) { throw "LLVM installer checksum mismatch: $hash" }
          $target = "C:\llvm-$env:LLVM_WINDOWS_VERSION"
          Start-Process -FilePath $installer -ArgumentList "/S", "/D=$target" -Wait
          "$target\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: WiX ${{ env.WIX_VERSION }}
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity
          cache: true
      - name: Build
        run: |
          cmake --preset windows-package
          cmake --build --preset windows-package
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # The executables after the build, before CPack: the MSI contains the signed files.
      - name: Sign the executables
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\build\windows-package\app\gui\hio-monitor.exe
            ${{ github.workspace }}\build\windows-package\app\cli\hio.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: MSI
        run: cpack --preset windows-package -B build/packages
      - name: Sign the MSI
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build\packages
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify the signatures, ICE validation
        shell: pwsh
        run: |
          $msi = (Get-ChildItem build/packages -Filter *.msi | Select-Object -First 1).FullName
          foreach ($file in @("build/windows-package/app/gui/hio-monitor.exe", "build/windows-package/app/cli/hio.exe", $msi)) {
            & signtool verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed: $file" }
          }
          wix msi validate $msi
      - name: Symbols (.pdb, ADR-0123)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force symbols | Out-Null
          Copy-Item build/windows-package/app/gui/hio-monitor.pdb, build/windows-package/app/cli/hio.pdb symbols/
          Compress-Archive -Path symbols/* -DestinationPath "build/packages/hio-monitor-${{ needs.gate.outputs.version }}-symbols-windows.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            build/packages/*.msi
            build/packages/*-symbols-windows.zip

  publish:
    name: publish (checksums, attestations, draft release)
    needs: [gate, linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write     # the draft release
      id-token: write     # build provenance attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [ "${{ needs.gate.outputs.prerelease }}" = "true" ]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" \
            --draft $prerelease --generate-notes \
            --title "HARDWARIO Monitor ${{ needs.gate.outputs.version }}"
